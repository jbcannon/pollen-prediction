name: Add the finished season to the history and the gallery

# Every 2 June, once the January-May season is over:
#   1. download the season that just finished and add it to the analog-year history (data/history/), so
#      next year's forecasts can replay it;
#   2. build that season's final map for the gallery (site/seasons/YYYY/ and its thumbnail);
#   3. commit both straight to main, and start the daily workflow so the site is rebuilt and published
#      right away (the daily run also happens on its own at 10:30 UTC).
# From 1 June the main map already shows the next season's outlook (see scripts/run_daily.py); this job
# only adds the year that just ended to the history and the gallery, and refreshes the outlook so it uses the
# newest ten springs.
#
# scripts/build_history.py refuses to write anything if the new season is under 95% complete or old readings
# went missing, so a bad download changes nothing (the run fails and GitHub emails whoever last edited this file).
# The station list is not changed here: stations that newly qualify, or have stopped reporting, are a yearly
# re-survey done by hand once a year (notes/research/stations/survey.py).
#
# Run it by hand from the Actions tab to redo it (it changes nothing if there is nothing new).
on:
  schedule:
    - cron: "0 9 2 6 *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: extend-history
  cancel-in-progress: false

jobs:
  extend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Install the project (the gallery group adds matplotlib for the thumbnails)
        run: uv sync --locked --group gallery
      - name: Download the history again, including the season that just finished
        run: uv run python scripts/build_history.py
      - name: Check the stored history
        run: uv run pytest tests/test_history_store.py -q
      - name: Build the new season's gallery map and thumbnails
        run: uv run python scripts/build_gallery.py --only-missing
      - name: Commit the new season
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/history site/seasons site/gallery
          if git diff --cached --quiet; then
            echo "Nothing new to add."
            exit 0
          fi
          year=$(date -u +%Y)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add the $year season to the history and the gallery"
          git push
          gh workflow run daily.yml
